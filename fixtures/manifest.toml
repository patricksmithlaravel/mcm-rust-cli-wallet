# P3-3 raised this from 3 to 22 by replacing the generator's selector. It used
# to select vectors carrying `crosscheck_typescript_expected` -- a transcribed
# literal that existed exactly three times -- so the size of the project's only
# independent oracle was set by how many literals somebody had typed. The domain
# is now every vector in group C, classified by the fields it carries.
#
# Q2-c took it from 22 to 29, and `not_crosschecked` is now EMPTY: every vector
# in group C is crosschecked against a second implementation.
#
# The seven added are C4-A1..A7, the end-to-end secret -> pk -> address path,
# and the reason they were held back had been wrong for six of them since it was
# written. It was one blanket string assigned in a loop over all seven ids: that
# reaching them needs the TypeScript to build a WOTS+ key from `adrs_in_words`,
# and that byte-versus-word `adrs` representation is what errata 51 is about, so
# a mismatch would surface as an address disagreement -- a red about a subject
# it does not name.
#
# Six of the seven carry an ALL-ZERO `adrs`, whose byte image is identical under
# every endianness. There was no representation decision to get wrong. Only
# C4-A5 carries a non-zero `adrs`, it is crosschecked under errata 51's settled
# little-endian reading, and its agreement is fresh executed corroboration of
# that decision rather than an assumption riding on it -- measured, the
# big-endian image produces a completely different address. Errata 80.
#
# Its own group rather than extra fields on group C, for two reasons that are
# both structural rather than stylistic.
#
# First, `file` is singular: a Group names exactly one JSON file, and
# manifest_and_disk_agree asserts the manifest and the directory match in both
# directions. A second file under group C's entry is not representable, and a
# second file listed nowhere fails that test -- correctly.
#
# Second, the two files have different oracles and the `oracle` block is
# file-level. group_c_addr.json is the C. This is the TypeScript, executed.
# Merging them would force a per-vector exception to a file-level claim, which is
# the erosion group_f_is_specification_not_crosscheck exists to stop.
#
# The id is "CX", not "G". Group ids A-F name subject areas; this names group C's
# crosscheck, and a fresh letter would read as a seventh subject. It is also not
# "G" specifically because that collides with unrelated naming already in use.

