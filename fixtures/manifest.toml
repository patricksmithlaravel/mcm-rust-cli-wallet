name    = "Address derivation, Base58, CRC-16"
status  = "active"
vectors = 29
# Ten, over twenty-nine vectors: C-addr-from-wots-fill42 reuses
# addr_from_wots() @ ledger.c:109, which C4-A0..A6 already cite. A vector is
# not necessarily a source, and the two counts are asserted separately so
# neither can stand in for the other.
