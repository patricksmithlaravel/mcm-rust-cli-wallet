# Coverage manifest for the fixture corpus.
#
# tests/kat.rs asserts this file and the directory agree in BOTH directions:
# every *.json on disk appears here, and every entry here exists on disk. A
# disagreement fails the suite. That is what stops a KAT run from passing by
# iterating nothing.
#
# `vectors` and `sources` are asserted against what the harness actually finds,
# so a vector added or removed upstream cannot pass unnoticed either.
#
# Regenerated by hand when reference/gen-fixtures/ changes. Fixtures are the
# regression suite; a diff in them is never noise.
#
# THIS FILE IS EDITABLE. The standing rule is stated as "nothing under
# fixtures/", which is broader than what it protects. The protected class is
# generated oracle data -- vectors, sidecars, hashes, expected values, counts,
# file lists -- immutable because editing it is how a wrong implementation
# certifies itself. This file is hand-maintained prose about that data, and
# tools/superset-check.py:173-174 already excludes it from the generated-file
# comparison -- both the old and new sides, so it is never diffed and never
# hashed, while every other file in the tree is content-hashed by sha() at :168.
# That exclusion is the machine-readable form of the boundary, and the rule
# should be read against it rather than against the directory name.
#
# The `reason` blocks are the intended place for a finding whoever edits a group
# must meet. What is NOT editable, here or anywhere under fixtures/: the
# per-group `vectors`/`sources` counts, the file lists, `total_vectors`,
# `reference_pin`, and every value in every *.json. Those are asserted against
# what the harness finds, so changing one to match an implementation is exactly
# the move the rule exists to prevent. See errata 49.
#
# `pending` is known fixture debt: work the generator owes, filed on the group
# whose data it concerns so that someone editing that group meets it. It is not
# a skip list — every vector below still runs. tests/kat.rs prints these in
# every run, because debt recorded only in a commit message or a design doc is
# debt that surfaces solely to whoever already suspects it exists (errata 15).
#
# It was emptied in session 2b, which discharged the four items session three
# filed, and group F has carried three items since W1-4 (errata 154). This
# comment said "currently empty on every group" from then until W1-6 -- reported
# stale by W1-5b (errata 157) and corrected here. The field stays because the
# convention is general.

[corpus]
# 189 -> 213 in W1-6: group M (6) and group N (18). 217 -> 5364 in P14, the
# bulk corpus (errata 215): B +14, D +22, F +81, and five new groups -- AK
# 1512, BK 1128, HS 390, AKX 1000, CK 1000. Nothing reads this key; the
# asserted total is kat.rs's TOTAL_P14, typed independently (errata 28).
total_vectors = 5364
# The C reference the A-E generator linked against. Groups F and CX link no C at
# all and pin submodule commits and npm versions instead, which do not fit one
# field -- they are in the `pin` block inside each of those two files.
reference_pin = "bbbacea"
# Was "699f41b" until P3-3, which is not a commit that exists in
# reference/mochimo-core -- `git cat-file` cannot resolve it there. Nothing
# asserted this field against the tree, so it drifted silently. The value is now
# what build/refver.h records as REF_CORE_SHA, which is the sha the generator
# compiles against and stamps into every run.

