# Coverage manifest for the fixture corpus.
#
# tests/kat.rs asserts this file and the directory agree in BOTH directions:
# every *.json on disk appears here, and every entry here exists on disk. A
# disagreement fails the suite. That is what stops a KAT run from passing by
# iterating nothing.
#
# `vectors` and `sources` are asserted against what the harness actually finds,
# so a count that disagrees with the directory cannot pass unnoticed either.
#
# THE CORPUS IS FROZEN. It is replayed, never regenerated: nothing in this
# repository produces a vector, and no vector here is downstream of anything
# that can be re-run. A vector that looks wrong is a finding about this crate,
# or about the reading of the reference behind it, and is answered in the code
# or in the specification -- never by moving the vector.
#
# THIS FILE'S PROSE IS THE ONE EXCEPTION. The standing rule is stated as
# "nothing under fixtures/", which is broader than what it protects. The
# protected class is generated oracle data -- vectors, sidecars, hashes,
# expected values, counts, file lists -- immutable because editing it is how a
# wrong implementation certifies itself. The `reason` blocks are
# hand-maintained prose about that data, and are the intended place for a
# finding whoever reads a group must meet. What is NOT editable, here or
# anywhere under fixtures/: the per-group `vectors`/`sources` counts, the file
# lists, `total_vectors`, `reference_pin`, and every value in every *.json.
# Those are asserted against what the harness finds, so changing one to match
# an implementation is exactly the move the rule exists to prevent.
#
# `pending` is fixture debt a frozen corpus cannot discharge: a property of the
# recorded data that a reader replaying it has to know about, filed on the
# group whose data it concerns. It is not a skip list — every vector below
# still runs. tests/kat.rs prints these in every run, because debt recorded
# only in a commit message reaches solely whoever already suspects it exists.

[corpus]
# Nothing reads this key: the asserted total is kat.rs's own constant, typed
# independently, so the two are a comparison rather than a restatement.
total_vectors = 5364
# The C reference the A-E generator linked against. Groups F and CX link no C at
# all and pin submodule commits and npm versions instead, which do not fit one
# field -- they are in the `pin` block inside each of those two files.
reference_pin = "bbbacea"
# The reference is not in this repository, so this field cannot be checked
# against a checkout. What holds it is
# invariants.rs::corpus_reference_pin_matches_the_commit_the_documents_state:
# AGENT.md and the specification both state the commit, and this must be a
# prefix of it. A corpus and its documents disagreeing about the corpus's own
# provenance is the failure that check exists to name.

