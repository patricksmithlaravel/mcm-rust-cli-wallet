[[group]]
id      = "F"
file    = "group_f_derivation.json"
name    = "Extension seed derivation (TypeScript)"
status  = "active"
# Ninety-six over fifteen sources: the rotation sweep (64 vectors, one
# source), the account sweep (11, sharing a source), the three BIP39 library
# captures (6 vectors, three sources) and the fifteen curated vectors the
# group opened with.
vectors = 96
sources = 15
reason  = """
src/derive and src/mnemonic replay all ninety-six, through a \
kat.rs dispatch arm per source over tests/support/derivation_walk.rs -- one \
walk, shared with the C-free proof in tests/derive.rs. Group F is the only \
group whose subject is not the vendored C: it captures the seed derivation the \
published browser extension performs, which exists solely as TypeScript in \
reference/mochimo-wallet and has no counterpart in reference/mochimo-core. The \
vectors are executed output, not transcription -- the capture called the \
TypeScript and reimplements none of it, on fixed seeds with no randomness or \
clock, and the file's own `pin` block records the three submodule commits and \
three npm versions it ran against.

A SPECIFICATION CAPTURE, NOT A CROSSCHECK, and the difference is \
load-bearing. A crosscheck's independence is two implementations of one \
algorithm agreeing; group F has one implementation and no second opinion, so \
these vectors carry none of that error-detecting power. A Rust port agreeing \
with them proves the port matches the extension -- which is the requirement -- \
and proves nothing about whether the extension is right. No differential \
exists either: the C's wallet uses a different scheme. The fixture states the \
class in its own `oracle` block and \
invariants.rs::group_f_is_specification_not_crosscheck asserts it, so the \
distinction cannot erode into "we have a second oracle now".

F-ascii-control replays as NOT PORTED (kat.rs NOT_CALLED_IDS): it is the \
control for F-high-byte-seed's zero call counts, and the ASCII round-trip it \
records is on a branch nothing live takes. Its fields are read and the \
dead-path anchor is asserted; no Rust reproduces the round-trip.\
"""
# A property of the recorded data that a reader replaying it has to know
# about. Every vector above still runs; this one carries a value that is not
# what its name suggests, and the corpus is frozen, so the harness works
# around it rather than the vector being changed to suit.
pending = [
    "F-counter-endianness's `same_convention` was computed over unequal widths (an 8-hex-char string against a 16-hex-char one), so it is false whatever the conventions are; the harness compares the overlapping four bytes instead and does not read the recorded boolean.",
]

[[group]]
id      = "RX"
file    = "group_rx_ripemd.json"
name    = "RIPEMD-160 outside the reference's reachable domain"
status  = "active"
vectors = 26
sources = 1
reason  = """
A third kind of oracle, and the only group in the corpus with NO REFERENCE SIDE AT ALL. The vendored ripemd160_final overflows a one-block stack buffer for every input length with len % 64 >= 56, so for one length in every 64 the C has no answer and cannot be given one: calling it is what crashes. That is not fixture debt, because no number of vectors closes it.

What this group records is @noble/hashes' RIPEMD-160, reached through MochimoHasher, so that RustCrypto's ripemd -- which native::ripemd160 is -- can be checked against something other than itself. Two independent implementations of a PUBLISHED algorithm, neither being the other's specification, which is error detection rather than conformance and is a stronger relationship than group C's. It is emphatically NOT evidence about Mochimo: nothing Mochimo-specific is computed anywhere in the group.

It is deliberately not part of CX. CX's oracle block claims the C computed the values in group_c_addr.json and the TypeScript computed the values beside them; for this class the C computed nothing, so these vectors would make that sentence false of some of CX's members. A group whose stated claim holds for only part of its contents is precisely the erosion group_f_is_specification_not_crosscheck exists to stop.

Twenty-four vectors are the faulting-class lengths in 0..=200 -- residues 56..=63 at three successive block counts, so the overflowing store is exercised as the first block, after one full block, and after several. The remaining two are RIPEMD-160's own published test vectors that land inside the faulting class: the 56-byte overlapping-quadruples string and the 62-byte alphanumeric one. The vendored implementation cannot compute TWO of RIPEMD-160's published test vectors. Measured rather than argued -- inlen 55 returns a digest, inlen 62 exits 134, which is SIGABRT.

A hand-transcribed list of published members filtered through the faulting-class predicate cannot detect a member that was never transcribed in, which is why the whole nine-member suite is carried: every digest is executed, including the seven that never reach this file, and both the suite size and the qualifying count are asserted, so the count is an output of the predicate rather than a premise the list was built to satisfy.

The defect itself is unfixed, which is why this group exists. Its disclosure \
status is a different fact and is not restated here: a status copied into \
several sites has to be corrected at each of them when it changes, and one of \
those copies is always the stale one a reader finds.\
"""

