[[group]]
id      = "RX"
file    = "group_rx_ripemd.json"
name    = "RIPEMD-160 outside the reference's reachable domain"
status  = "active"
vectors = 26
sources = 1
reason  = """
A third kind of oracle, and the only group in the corpus with NO REFERENCE SIDE AT ALL. The vendored ripemd160_final overflows a one-block stack buffer for every input length with len % 64 >= 56 (docs/errata.md entry 52), so for one length in every 64 the C has no answer and cannot be given one: calling it is what crashes. That is not fixture debt, because no number of vectors closes it -- which is why it was filed as a marker instead.

What this group records is @noble/hashes' RIPEMD-160, reached through MochimoHasher, so that RustCrypto's ripemd -- which native::ripemd160 is -- can be checked against something other than itself. Two independent implementations of a PUBLISHED algorithm, neither being the other's specification, which is error detection rather than conformance and is a stronger relationship than group C's. It is emphatically NOT evidence about Mochimo: nothing Mochimo-specific is computed anywhere in the group.

It is deliberately not part of CX. CX's oracle block claims the C computed the values in group_c_addr.json and the TypeScript computed the values beside them; for this class the C computed nothing, so these vectors would make that sentence false of some of CX's members. A group whose stated claim holds for only part of its contents is precisely the erosion group_f_is_specification_not_crosscheck exists to stop.

Twenty-four vectors are the faulting-class lengths in 0..=200 -- residues 56..=63 at three successive block counts, so the overflowing store is exercised as the first block, after one full block, and after several. The remaining two are RIPEMD-160's own published test vectors that land inside the faulting class: the 56-byte overlapping-quadruples string and the 62-byte alphanumeric one. The vendored implementation cannot compute TWO of RIPEMD-160's published test vectors. Measured rather than argued -- inlen 55 returns a digest, inlen 62 exits 134, which is SIGABRT.

P3-6 corrected this from twenty-five vectors and one published member. The generator's PUBLISHED array held a single hand-transcribed entry and filtered it through the faulting-class predicate, which cannot detect a member that was never transcribed in -- and errata 52's own enumeration of the misses recorded the 56-byte string's length as 64, the one direction that removes it from the class. The transcription that omitted it and the figure that excused the omission were the same mistake, recorded twice and agreeing with itself. The whole nine-member suite is now carried; every digest is executed, including the seven that never reach this file; and both the suite size and the qualifying count are asserted, so the count is an output of the predicate rather than a premise the list was built to satisfy. See docs/errata.md entry 70.

Disclosure status for this defect is recorded in errata 52, the authoritative \
copy, and is deliberately not restated here -- six sites carried independent \
copies of it until R5 and each had to be corrected separately when the status \
changed (errata 100). The defect itself is unfixed, which is why this group \
exists; that is a different fact from its disclosure status and the two moved \
separately.\
"""

