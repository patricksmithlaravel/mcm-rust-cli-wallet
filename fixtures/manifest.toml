[[group]]
id      = "CX"
file    = "group_c_crosscheck.json"
name    = "Group C executed TypeScript crosscheck"
status  = "active"
vectors = 29
sources = 8
# The domain is every vector in group C, classified by the fields it carries,
# and `not_crosschecked` is EMPTY: every vector in group C is crosschecked
# against a second implementation. A selector keyed on a transcribed literal
# would set the size of this project's only independent oracle by how many
# literals somebody had typed.
#
# C4-A1..A7 are the end-to-end secret -> pk -> address path. Six of the seven
# carry an ALL-ZERO `adrs`, whose byte image is identical under every
# endianness, so there is no representation decision to get wrong in them.
# Only C4-A5 carries a non-zero `adrs`; it is crosschecked under the settled
# little-endian reading of the byte-versus-word `adrs` representation, and its
# agreement is executed corroboration of that reading rather than an
# assumption riding on it -- measured, the big-endian image produces a
# completely different address.
#
# Its own group rather than extra fields on group C, for two reasons that are
# both structural rather than stylistic.
#
# First, `file` is singular: a Group names exactly one JSON file, and
# manifest_and_disk_agree asserts the manifest and the directory match in both
# directions. A second file under group C's entry is not representable, and a
# second file listed nowhere fails that test -- correctly.
#
# Second, the two files have different oracles and the `oracle` block is
# file-level. group_c_addr.json is the C. This is the TypeScript, executed.
# Merging them would force a per-vector exception to a file-level claim, which is
# the erosion group_f_is_specification_not_crosscheck exists to stop.
#
# The id is "CX", not "G". Group ids A-F name subject areas; this names group C's
# crosscheck, and a fresh letter would read as a seventh subject. It is also not
# "G" specifically because that collides with unrelated naming already in use.

[[group]]
id      = "D"
file    = "group_d_tx.json"
name    = "Transaction serialization and validation"
status  = "active"
# Ds12-N* is the destination-count sweep, signed and validated at twenty-two
# counts between Ds6's {1, 2, 3, 256}. Every one carries the `wire` key and
# both offline verdicts, so all twenty-two are in the `validated` census.
vectors = 72
sources = 11
# EVERY VECTOR REPLAYS: the five that need no TXENTRY, the 21 of the
# transaction core, the 18 that record a verdict or a hash over a byte
# sequence the generator held privately, and the destination-count sweep.
#
# The 18 each carry the sequence they were taken over -- hashed_wire,
# baseline_wire, mutated_wire, validated_wire, case_wire, wire_one_byte_long --
# so every replay is load bytes, call the reference, compare. A verdict
# recorded over bytes the corpus does not carry cannot be handed back to
# anything. Nothing is built, signed or mutated in Rust, which is the standing
# constraint: a tx_val__wots verdict is the reference's opinion of a SPECIFIC
# byte sequence, and a Rust-signed entry would make the harness the thing
# under test.
#
# Those six keys are deliberately not called `wire`. That name is the selector
# for the signature census, which pairs it with off_wots_signature and
# signed_len and asserts its own population. Reusing it for identity-signed
# vectors carrying no verdict would enrol them in that census and turn a green
# test red about a subject it does not name.
#
# THE DISPATCH IS FIVE KEYS AND SIX HANDLERS. `tx_hash` groups eight vectors
# whose field sets have an EMPTY intersection -- Ds1-N1..N256 carry 8 data
# fields, Ds3/Ds4/Ds5 carry 3 -- so kat.rs::tx_hash_vector splits on shape
# exhaustively, with both impossible corners panicking. Dispatching on the
# source string alone would have put one abstraction over a set that cannot
# support it.
#
# Ds5 was the live instance of that trap and is now faced rather than gated:
# Ds3/Ds4 carry hash_unchanged, Ds5 carries hash_changed, and Ds5 is the
# CONTROL proving the other two measure exclusion rather than a hash that
# ignores everything. kat.rs::tx_hash_mutation matches over both keys and
# panics on neither-or-both, so the control cannot silently stop controlling.
#
# THE SECOND SIDE IS FOUR CENSUSES, not one. Coverage fail-closed over the
# keys a vector HAS cannot see a key that was never emitted: a has() gate
# finds it missing and the vector replays green with a validator nothing
# checked. Each census asserts the population instead, so the count is what
# fails rather than the absence going unnoticed. group_d_core_census does this
# for the 21;
# group_d_signature_negative_census, group_d_tx_hash_census and
# group_d_cases_census do it for the 18.
#
# D5 carries both verdict keys: signed exactly as D4, and validated by the
# tx_val__wots call D4 has. A signature the reference never validated is a
# real signature nothing stands behind, which is what the signature census's
# `reproduced_without_verdict` names; the set is empty and is asserted empty
# rather than deleted.
#
# TWO ITEMS HERE ARE PORT SCOPE, NOT TRANSACTION SCOPE. They are recorded on
# this group because this is the file whoever reads group D reads.
#
# FIRST: the `identity` block is a complete tx_bot_get_wots KAT that nothing
# runs. It is a TOP-LEVEL object rather than a member of `vectors`, so it has
# no `id`, Fixture::vectors() never walks it, and no coverage check is offered
# it. tx_bot_get_wots takes the secret ALONE and produces pk, pub_seed and
# adrs together: one input, three checkable outputs. What blocks it is that
# the block has no `id`, and giving it one without an oracle behind the
# function would produce a vector nothing can answer.
#
# SECOND: Ds8b is a signing-ORDER property. The capture set the source
# address tag half to 20 x 0xa5 and THEN called tx_sign, so the signature is
# valid for the transaction as written; every other negative in Ds7..Ds11
# mutates AFTER signing. Ds8b is therefore not a fork case, which is why
# kat.rs::tx_val_wots_negative keys its arm on the bytes the validator saw
# rather than on the mutation. The obligation it states for the port: sign the
# bytes as they stand at the moment of signing. An implementation that
# normalises or recomputes the source address on its way into the signer
# disagrees with this vector alone and agrees with every other one, which is
# the hardest kind of disagreement to attribute after the fact.
#
# SIX VECTORS CLOSE THREE SHAPES THE CORPUS HAD NO WIRE IMAGE FOR. All six
# carry a `source` the group already used, so they dispatch to handlers that
# already exist rather than arriving with new ones.
#
# The measurement that found the three is not the one that replays vectors. It
# is a FIELD-LEVEL CENSUS over the emitted bytes -- for each field, how many
# distinct values does the corpus contain, and is any of them distinguishable
# from the obvious wrong answer. Replay measures the vectors that exist, so
# replaying all of them is coverage of the corpus and reads like coverage of
# the subject.
#
# D16 / D16-badref -- MDST::ref inside a transaction. Every destination of every
# one of the 43 images carried an all-zero ref, so a serializer that ignored the
# field reproduced all of them byte for byte. D10/D11 pin the grammar on a bare
# 16-byte buffer, which is a different artifact. The NEGATIVE is the unit here,
# not decoration: without it, D16's VEOK is equally the answer a validator that
# never read the field would give.
#
# D17 -- a change address whose two halves differ, which the group had never
# had, because addr_from_wots runs every address through addr_from_implicit and
# that writes the same 20 bytes into both halves. Two properties, and they are
# DIFFERENT CLAIMS:
#
#   * serializer-facing, and the one that matters here: this is the first image
#     where tag_ptr and hash_ptr select different bytes, so a wrong
#     ADDR_HASH_OFF flips a recorded boolean. On every existing image both
#     predicates hold under ANY offset, which is precisely why nothing caught
#     it. Ds8b closes the same hole for src_addr and not for chg_addr.
#   * C-facing, and weaker: src_chg_tag_equal and src_chg_hash_equal are the
#     pair tx_val requires, computed by the REFERENCE'S OWN comparators over the
#     bytes it laid out. But tx_val was never called -- it needs an open ledger,
#     and `rule_not_evaluated` says so in the same sentence the three D9 vectors
#     carry. This is an image two comparators approve of, NOT one a validator
#     accepted end to end. Do not read it as a valid transaction.
#
# The generator's chg_guard is what makes D17's shape a fact rather than a
# coincidence, and the reason is worth carrying: the harness recomputes those
# booleans from the wire bytes, so a wrongly-built chg_addr would move the
# fixture and the harness TOGETHER and eq_bool would compare true == true. A
# recorded boolean cannot police the shape it records.
#
# D18 -- four MUTUALLY DISTINCT asymmetric 64-bit header values. Without them
# change_total only ever held zero or all-0xff, a palindrome, in D8, the vector
# whose own note explains why palindromes are insufficient. The adjacent defect
# found while filling it: D8 gave send_total, fee_total and blk_to_live the SAME
# value, so a serializer writing those three in the wrong order passes it. And
# D8 records change_total_bytes with no change_total_value -- a value pinned and
# never decoded, so even its byte-order claim for those fields is half-tested.
# D18 records both halves for all four fields.
#
# D19-totals / D19-fees -- EMCM_XTXTOTALS and EMCM_XTXFEES. Both totals are
# COMPUTED FROM THE DESTINATION LIST rather than supplied, which is the specific
# thing a transaction builder gets wrong, and neither verdict was in the corpus.
# D19-fees is the sharper one: mdst_val accumulates one MFEE PER DESTINATION,
# so a builder charging a single fee for a multi-destination transaction is
# rejected. EMCM_MFEES_OVERFLOW, the third uncovered arm, stays uncovered and
# that is knowledge rather than debt: MFEE is 500 and the count is bounded at
# 256, so it is unreachable for any transaction shape and would need an
# implausible mfee ARGUMENT rather than a transaction.
#
# THE SIX DO REUSE THE `wire` KEY, AND THAT IS THE OPPOSITE OF THE DECISION
# ABOVE RATHER THAN INCONSISTENT WITH IT. The name is avoided for
# identity-signed entries carrying no verdict, which would enrol in the
# signature census and grow `reproduced_without_verdict`. These six SHOULD be
# in that census: every one is signed AND has tx_val__wots run over it, so each
# lands in `validated`. The rule is not "do not use the key"; it is "know which
# census the key enrols you in".
#
# No `activated` and no `still_deferred`: the loader rejects an active group
# carrying either, because a partition is only meaningful while something is
# on the other side of it.

[[group]]
id      = "E"
file    = "group_e_net.json"
name    = "Network constants and packet framing"
status  = "active"
