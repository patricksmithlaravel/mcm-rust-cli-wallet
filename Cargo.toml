[workspace]
resolver = "2"
members = ["crates/mochimo-crypto"]

[workspace.package]
edition = "2021"
# 1.89 for `std::fs::File::try_lock` (stable since 1.89.0): the keystore holds
# `keystore.lock` with flock(2), which the kernel releases on any process death
# including SIGKILL, so a held lock always means a live holder. The alternative
# -- an O_EXCL lockfile removed on Drop -- is the stale-lock design, whose
# stale locks teach an operator to delete the lock file, and unlinking on Drop
# is the classic two-holders race.
rust-version = "1.89"
# The Mochimo Cryptocurrency Engine License Agreement, version 1.0: the
# licence a derivative work of Mochimo is published under. The text is the
# root `LICENSE.md`, copied byte for byte from the supplied file, and the
# crate inherits this declaration from the workspace.
license-file = "LICENSE.md"
